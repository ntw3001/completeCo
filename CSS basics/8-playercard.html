<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="8-style.css">
  <title>BloodBowlManCard</title>
</head>
<body>
  <div class="player-card">
    <div class="left-side">
      <div class="player-name">
        <h3>Rubeo Wurst</h3>
        <h5>Chelmsford City</h5>
        <p>Lineman</p>
      </div>
      <div class="player-stats">
        <div class="stat">
          <span>MA</span>
          <span></span>
          <span>6</span>
        </div>
        <div class="stat">
          <span>ST</span>
          <span></span>
          <span>3+</span>
        </div>
        <div class="stat">
          <span>AG</span>
          <span></span>
          <span>3+</span>
        </div>
        <div class="stat">
          <span>PA</span>
          <span></span>
          <span>4+</span>
        </div>
        <div class="stat">
          <span>AV</span>
          <span></span>
          <span>9+</span>
        </div>
      </div>
      <div class="player-skills">
        <p>Block, tackle</p>
      </div>
    </div>
    <div class="right-side">
      <div class="player-image">
        <img src="./images/rubeo.png" alt="Rubeo Wurst">
      </div>
      <div class="player-quote">
        <p>"Get Chlemed, bitches!"</p>
      </div>

      </div>
  </div>

</body>
</html>
