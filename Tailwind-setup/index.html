<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="output.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Tailwind</title>
</head>
<body class="bg-gray-900 text-white flex justify-center items-center min-h-screen">
  <div class="bg-gray-700 flex items-center flex-col justify-center p-8 rounded-lg shadow-lg max-w-sm w-96">
    <h2 class="text-center text-2xl mb-6 font-bold">Login</h2>
    <form>
      <div>
        <label for="">Email</label>
        <input type="email" class="bg-gray-800 border border-gray-600 rounded-lg p-2 w-full focus:outline-none focus:ring-2 focus:ring-yellow-200" placeholder="Enter your email">
      </div>
      <div>
        <label for="">Password</label>
        <input type="password" class="bg-gray-800 border border-gray-600 rounded-lg p-2 w-full focus:outline-none focus:ring-2 focus:ring-yellow-200" placeholder="Enter your password">
      </div>

        <a href="#" class="text-blue-400 hover:text-blue-600">Forgot Password?</a>
      <div class="text-center">
        <button type="submit" class="bg-yellow-200 hover:bg-blue-600 text-gray-900 font-bold py-1 w-50 rounded-lg mt-4">Login</button>
      </div>
    </form>
  </div>
</body>
</html>
