<!DOCTYPE html>

<head>

<body class="bg-gray-900 text-white min-h-screen">
<div class="m-4 grid gap-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5">

  <div class="w-full min-h-[100px] rounded-lg shadow bg-teal-500 p-4 text-center pt-10">We</div>
  <div class="w-full min-h-[100px] rounded-lg shadow bg-blue-500 p-4 text-center pt-10">are</div>
  <div class="w-full min-h-[100px] rounded-lg shadow bg-purple-500 p-4 text-center pt-10">all</div>
  <div class="w-full min-h-[100px] rounded-lg shadow bg-pink-500 p-4 text-center pt-10">evenly</div>
  <div class="w-full min-h-[100px] rounded-lg shadow bg-red-500 p-4 text-center pt-10">segmented!</div>
</div>
<br>
<div class="m-4 grid gap-2 sm:grid-cols-12 grid-cols-1">
  <div class="w-full min-h-[100px] col-span-3 rounded-lg shadow bg-orange-500 p-4 text-center pt-10">But</div>
  <div class="w-full min-h-[100px] col-span-1 rounded-lg shadow bg-teal-500 p-4 text-center pt-10">we,</div>
  <div class="w-full min-h-[100px] col-span-5 rounded-lg shadow bg-blue-500 p-4 text-center pt-10">we</div>
  <div class="w-full min-h-[100px] col-span-3 rounded-lg shadow bg-purple-500 p-4 text-center pt-10">are</div>
  <div class="w-full min-h-[100px] col-span-7 rounded-lg shadow bg-pink-500 p-4 text-center pt-10">unevenly</div>
  <div class="w-full min-h-[100px] col-span-5 rounded-lg shadow bg-red-500 p-4 text-center pt-10">segmented.</div>
</div>
<br>
<div class="m-4 grid gap-2 sm:grid-cols-12 grid-cols-1">
  <div class="w-full min-h-[100px] col-span-3 rounded-lg shadow bg-orange-500 p-4 text-center pt-10">One</div>
  <div class="w-full min-h-[100px] col-span-1 rounded-lg shadow bg-teal-500 p-4 text-center pt-10">of</div>
  <div class="w-full min-h-[100px] col-span-5 rounded-lg shadow bg-blue-500 p-4 text-center pt-10">us</div>
  <div class="w-full min-h-[100px] col-span-3 rounded-lg shadow bg-purple-500 p-4 text-center pt-10">is</div>
  <div class="w-full min-h-[100px] col-span-12 rounded-lg shadow bg-gray-100 text-black p-4 text-center pt-10 hidden sm:block lg:hidden xl:block 2xl:hidden">BOO</div>
  <div class="w-full min-h-[100px] col-span-7 rounded-lg shadow bg-pink-500 p-4 text-center pt-10">a</div>
  <div class="w-full min-h-[100px] col-span-5 rounded-lg shadow bg-red-500 p-4 text-center pt-10">ghost!</div>
</div>
